<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech VexoraX — Admin Dashboard</title>
<style>
  :root{
    --bg:#030712; --card:#111827; --border:#1f2937;
    --text:#f3f4f6; --muted:#9ca3af; --muted2:#6b7280;
    --purple:#9333ea; --purple-bright:#a855f7; --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}
  img,svg{display:block;}
  a{text-decoration:none;color:inherit;}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font:inherit;color:inherit;}
  ul{list-style:none;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .icon{width:18px;height:18px;flex-shrink:0;}
  @media(min-width:1024px){body{padding-right:80px;}}

  /* Top bar */
  #topbar{position:sticky;top:0;z-index:30;background:rgba(3,7,18,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1400px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .tb-left{display:flex;align-items:center;gap:12px;}
  #hamburger{display:inline-flex;color:var(--muted);}
  @media(min-width:1024px){#hamburger{display:none;}}
  .brand{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .brand img{height:26px;width:auto;display:block;}
  .brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:14px;display:none;}
  @media(min-width:640px){.brand-name{display:inline;}}
  .tb-search{position:relative;display:none;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 16px;flex:1;max-width:280px;margin:0 24px;}
  @media(min-width:768px){.tb-search{display:flex;}}
  .tb-search input{background:transparent;border:none;outline:none;color:var(--text);font-size:14px;width:100%;}
  .tb-search input::placeholder{color:var(--muted2);}
  .search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;max-height:320px;overflow-y:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);display:none;}
  .search-results.open{display:block;}
  .search-results .sr-item{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .search-results .sr-item:last-child{border-bottom:none;}
  .search-results .sr-item:hover{background:#1f2937;}
  .search-results .sr-title{font-size:13px;font-weight:500;}
  .search-results .sr-meta{font-size:11px;color:var(--muted2);}
  .search-results .sr-empty{padding:14px;font-size:13px;color:var(--muted2);text-align:center;}
  .tb-right{display:flex;align-items:center;gap:16px;}
  .bell-wrap{position:relative;color:var(--muted);}
  .bell-dot{position:absolute;top:-2px;right:-2px;width:7px;height:7px;background:#ef4444;border-radius:50%;}
  .notif-panel{position:absolute;top:calc(100% + 14px);right:0;width:300px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);display:none;overflow:hidden;z-index:50;}
  .notif-panel.open{display:block;}
  .notif-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;}
  .notif-head button{font-size:11px;color:#c084fc;font-weight:500;}
  .notif-list{max-height:280px;overflow-y:auto;}
  .notif-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:#1f2937;}
  .notif-item.unread{background:rgba(147,51,234,.06);}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:#a855f7;flex-shrink:0;margin-top:6px;}
  .notif-item.read .notif-dot{background:transparent;}
  .notif-text{font-size:12.5px;color:#e5e7eb;}
  .notif-time{font-size:11px;color:var(--muted2);margin-top:2px;}
  .notif-empty{padding:20px;text-align:center;font-size:12px;color:var(--muted2);}
  .admin-pill{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .admin-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#60a5fa);flex-shrink:0;}
  .admin-pill span{font-size:14px;display:none;}
  @media(min-width:640px){.admin-pill span{display:inline;}}
  .admin-menu{position:absolute;top:calc(100% + 14px);right:0;width:170px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);display:none;overflow:hidden;z-index:50;}
  .admin-menu.open{display:block;}
  .admin-menu button{display:block;width:100%;text-align:left;padding:10px 14px;font-size:13px;color:#e5e7eb;}
  .admin-menu button:hover{background:#1f2937;}

  /* Mobile drawer */
  #drawer-overlay{display:none;position:fixed;inset:0;z-index:40;}
  #drawer-overlay.open{display:block;}
  .drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);}
  .drawer-panel{position:absolute;right:0;top:0;bottom:0;width:280px;background:var(--card);border-left:1px solid var(--border);padding:20px;overflow-y:auto;}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .drawer-head button{color:var(--muted);}
  .drawer-nav{display:flex;flex-direction:column;gap:4px;}
  .drawer-nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--muted);text-align:left;width:100%;}
  .drawer-nav button.active{background:linear-gradient(90deg,var(--purple),var(--blue));color:#fff;}

  /* Vertical rail */
  #rail{display:none;position:fixed;top:0;right:0;bottom:0;width:80px;background:var(--card);border-left:1px solid var(--border);flex-direction:column;align-items:center;padding:24px 0;z-index:30;}
  @media(min-width:1024px){#rail{display:flex;}}
  .rail-logo{width:60px;height:auto;display:flex;align-items:center;justify-content:center;margin-bottom:28px;flex-shrink:0;cursor:pointer;}
  .rail-logo img{width:100%;height:auto;object-fit:contain;}
  .rail-nav{display:flex;flex-direction:column;gap:18px;flex:1;overflow-y:auto;align-items:center;}
  .rail-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;border-radius:12px;color:var(--muted2);flex-shrink:0;cursor:pointer;}
  .rail-item:hover{color:#d1d5db;}
  .rail-item.active{background:linear-gradient(180deg,var(--purple),var(--blue));color:#fff;}
  .vert-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.03em;white-space:nowrap;}
  .rail-admin-only{color:#4b5563;letter-spacing:.15em;margin-top:16px;flex-shrink:0;}

  main{max-width:1400px;margin:0 auto;padding:24px 16px 96px;}
  @media(min-width:640px){main{padding:24px 24px 96px;}}

  /* Page header */
  .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .page-header h1{font-size:24px;font-weight:700;}
  .page-header .sub{font-size:14px;color:var(--muted2);margin-top:4px;}
  .topbar-back{display:none;color:var(--muted);flex-shrink:0;}
  .topbar-back.visible{display:inline-flex;}
  .topbar-back:hover{color:#e5e7eb;}
  .date-pill{position:relative;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 16px;cursor:pointer;}
  .date-menu{position:absolute;top:calc(100% + 10px);right:0;width:170px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);display:none;overflow:hidden;z-index:50;}
  .date-menu.open{display:block;}
  .date-menu button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:12.5px;color:#e5e7eb;}
  .date-menu button:hover{background:#1f2937;}

  /* Dashboard grid */
  .dash-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:24px;}
  @media(min-width:1024px){.dash-grid{grid-template-columns:repeat(12,1fr);}}
  .col-admin{order:5;}
  .col-health{order:4;display:flex;flex-direction:column;gap:20px;}
  .col-activity{order:3;display:flex;flex-direction:column;gap:20px;}
  .col-charts{order:2;display:flex;flex-direction:column;gap:20px;}
  .col-stats{order:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(min-width:1024px){
    .col-admin{order:1;grid-column:span 2;}
    .col-health{order:2;grid-column:span 2;}
    .col-activity{order:3;grid-column:span 3;}
    .col-charts{order:4;grid-column:span 3;}
    .col-stats{order:5;grid-column:span 2;grid-template-columns:1fr;}
  }

  h3.card-title{font-size:14px;font-weight:600;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .link-btn{font-size:12px;color:#c084fc;}
  .link-btn:hover{text-decoration:underline;}

  /* Stat cards */
  .stat-card .chip{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .stat-card .value{font-size:24px;font-weight:700;}
  .stat-card .label{font-size:12px;color:var(--muted2);margin:4px 0 8px;}
  .stat-card .change{font-size:12px;color:var(--green);font-weight:500;display:flex;align-items:center;gap:4px;}
  .chip-purple{background:rgba(168,85,247,.15);color:#c084fc;}
  .chip-blue{background:rgba(59,130,246,.15);color:#60a5fa;}
  .chip-violet{background:rgba(139,92,246,.15);color:#a78bfa;}
  .chip-green{background:rgba(34,197,94,.15);color:#4ade80;}

  /* Charts */
  .chart-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px;}
  .chart-legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .week-pill{font-size:12px;color:var(--muted);background:#1f2937;padding:5px 12px;border-radius:999px;}
  .donut-wrap{position:relative;display:flex;justify-content:center;}
  .donut-center{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-center .total{font-size:20px;font-weight:700;}
  .donut-center .label{font-size:11px;color:var(--muted2);}
  .traffic-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px;font-size:12px;color:var(--muted);}
  .traffic-legend span{display:flex;align-items:center;gap:6px;}

  /* Recent enquiries */
  .enquiry-row{display:flex;align-items:center;gap:12px;padding:8px 0;}
  .enquiry-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(59,130,246,.4));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
  .enquiry-name{font-size:14px;font-weight:500;}
  .enquiry-type{font-size:12px;color:var(--muted2);}
  .enquiry-time{font-size:12px;color:var(--muted2);text-align:right;}
  .enquiry-new{font-size:11px;color:var(--green);font-weight:600;display:block;}

  /* Recent projects */
  .projects-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(min-width:640px){.projects-grid{grid-template-columns:repeat(3,1fr);}}
  .project-tile{border-radius:12px;overflow:hidden;border:1px solid var(--border);}
  .project-thumb{height:64px;}
  .project-info{padding:10px;}
  .project-info p{font-size:12px;font-weight:500;}
  .status-pill{display:inline-block;margin-top:4px;font-size:11px;padding:2px 8px;border-radius:999px;}
  .status-completed{background:rgba(34,197,94,.15);color:#4ade80;}
  .status-progress{background:rgba(245,158,11,.15);color:#fbbf24;}
  .status-new{background:rgba(59,130,246,.15);color:#60a5fa;}
  .status-handled{background:rgba(34,197,94,.15);color:#4ade80;}
  .status-published{background:rgba(34,197,94,.15);color:#4ade80;}
  .status-draft{background:rgba(107,114,128,.25);color:#9ca3af;}
  .status-active{background:rgba(34,197,94,.15);color:#4ade80;}
  .status-inactive{background:rgba(239,68,68,.15);color:#f87171;}
  .g1{background:linear-gradient(135deg,#ec4899,#f43f5e);}
  .g2{background:linear-gradient(135deg,#374151,#111827);}
  .g3{background:linear-gradient(135deg,#a855f7,#6366f1);}
  .g4{background:linear-gradient(135deg,#3b82f6,#06b6d4);}
  .g5{background:linear-gradient(135deg,#fb923c,#ef4444);}
  .g6{background:linear-gradient(135deg,#14b8a6,#22c55e);}

  /* Quick actions */
  .qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(min-width:640px){.qa-grid{grid-template-columns:repeat(3,1fr);}}
  .qa-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(31,41,55,.6);border-radius:12px;padding:16px 8px;text-align:center;transition:background .2s;}
  .qa-btn:hover{background:#1f2937;}
  .qa-btn svg{color:#c084fc;}
  .qa-btn span{font-size:12px;color:#d1d5db;line-height:1.2;}

  /* Site health */
  .health-top{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .health-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;}
  .health-metrics .m-label{color:var(--muted2);}
  .status-good{color:#60a5fa;}
  .status-excellent{color:#4ade80;}

  /* Storage */
  .storage-bar{height:8px;background:#1f2937;border-radius:999px;overflow:hidden;margin:12px 0 8px;}
  .storage-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:999px;}

  /* Admin access */
  .admin-access-icon{width:40px;height:40px;border-radius:12px;background:rgba(168,85,247,.15);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:#c084fc;}
  .admin-access p.desc{font-size:12px;color:var(--muted2);margin-bottom:16px;}
  .admin-access .meta{font-size:12px;color:var(--muted2);border-top:1px solid var(--border);padding-top:12px;}
  .admin-access .meta p{padding:2px 0;}

  /* Generic list pages */
  .page-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:20px 0;}
  .page-search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;flex:1;max-width:320px;}
  .page-search input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
  .page-search svg{color:#6b7280;width:15px;height:15px;flex-shrink:0;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:10px 18px;border-radius:10px;transition:opacity .2s;}
  .btn:hover{opacity:.9;}
  .btn-primary{background:linear-gradient(90deg,var(--purple),var(--blue));color:#fff;}
  .btn-secondary{background:#1f2937;color:#e5e7eb;border:1px solid var(--border);}
  .btn-danger{background:rgba(239,68,68,.15);color:#f87171;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}
  .btn-icon{padding:8px;border-radius:8px;background:#1f2937;}

  .data-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#7c3aed #0b1220;padding-bottom:6px;}
  .data-table-wrap::-webkit-scrollbar{height:8px;}
  .data-table-wrap::-webkit-scrollbar-track{background:#0b1220;border-radius:999px;}
  .data-table-wrap::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:999px;}
  .data-table-wrap::-webkit-scrollbar-thumb:hover{background:linear-gradient(90deg,var(--purple-bright),var(--blue));}
  table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  table.data-table th{text-align:left;color:var(--muted2);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--border);}
  table.data-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .cell-main{display:flex;align-items:center;gap:10px;}
  .cell-thumb{width:34px;height:34px;border-radius:8px;flex-shrink:0;}
  .cell-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,rgba(168,85,247,.4),rgba(59,130,246,.4));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
  .empty-state{text-align:center;padding:40px 16px;color:var(--muted2);font-size:13px;}
  .stars{color:#f59e0b;font-size:12px;}

  /* Toggle */
  .toggle{position:relative;width:42px;height:24px;border-radius:999px;background:#1f2937;flex-shrink:0;cursor:pointer;transition:background .2s;}
  .toggle.on{background:linear-gradient(90deg,var(--purple),var(--blue));}
  .toggle .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;}
  .toggle.on .knob{left:21px;}
  .integration-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);}
  .integration-row:last-child{border-bottom:none;}
  .integration-name{font-size:13px;font-weight:600;}
  .integration-desc{font-size:12px;color:var(--muted2);margin-top:2px;}

  /* Forms */
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .form-group input,.form-group select,.form-group textarea{width:100%;background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text);outline:none;}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#7c3aed;}
  .form-group textarea{resize:vertical;min-height:70px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:480px){.form-row{grid-template-columns:1fr;}}
  .settings-card{max-width:640px;}

  /* Modal */
  #modal-overlay{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;padding:16px;}
  #modal-overlay.open{display:flex;}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);}
  .modal-box{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  .modal-box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-box-head h3{font-size:16px;font-weight:700;}
  .modal-box-head button{color:var(--muted);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  /* Toast */
  #toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:#111827;border:1px solid #22c55e;color:#e5e7eb;font-size:13px;padding:10px 18px;border-radius:10px;box-shadow:0 10px 20px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;animation:toastIn .2s ease;}
  .toast.error{border-color:#ef4444;}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* Logout screen */
  .logout-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .logout-screen h2{font-size:20px;margin-bottom:8px;}
  .logout-screen p{color:var(--muted2);font-size:13px;margin-bottom:20px;}

  /* Login screen */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 30px;text-align:center;}
  .login-logo{height:34px;width:auto;margin:0 auto 24px;}
  .login-card h1{font-size:20px;font-weight:700;margin-bottom:6px;}
  .login-card p.sub{color:var(--muted2);font-size:13px;margin-bottom:24px;}
  .login-field{text-align:left;margin-bottom:16px;}
  .login-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}

function initials(name){ return String(name).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ---------------- Toast ---------------- */
function showToast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type==='error' ? ' error' : '');
  t.textContent = msg;
  wrap.appendChild(t);

}

/* ---------------- Modal ---------------- */
function openModal(title, bodyHtml, onSubmit, cancelLabel){
  cancelLabel = cancelLabel || 'Cancel';
  document.getElementById('modal-box').innerHTML = `

        <button type="button" class="btn btn-secondary" id="modal-cancel">${esc(cancelLabel)}</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>`;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-backdrop').onclick = closeModal;
  document.getElementById('modal-form').onsubmit = function(e){
    e.preventDefault();
    const data = {};
    new FormData(e.target).forEach((v,k)=>{ data[k]=v; });
    onSubmit(data);
    closeModal();
  };
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

function confirmAction(message, onYes){
  openModal('Please confirm', `<p style="font-size:13px;color:#d1d5db;margin-bottom:4px;">${esc(message)}</p>`, function(){});

  const submitBtn = form.querySelector('button[type=submit]');

  submitBtn.className = 'btn btn-danger';

function svgIcon(pathHtml, size) {

function buildNav(){
  const railNav = document.getElementById('rail-nav');
  const drawerNav = document.getElementById('drawer-nav');
  railNav.innerHTML = '';
  drawerNav.innerHTML = '';
  navItems.forEach((item) => {
    const el = document.createElement('div');
    el.className = 'rail-item' + (item.page === currentPage ? ' active' : '');
    el.title = item.label;
    el.dataset.nav = item.page;
    el.innerHTML = svgIcon(item.icon, 16) + '<span class="vert-label">' + item.label + '</span>';
    railNav.appendChild(el);

    const btn = document.createElement('button');
    btn.className = item.page === currentPage ? 'active' : '';
    btn.dataset.nav = item.page;
    btn.innerHTML = svgIcon(item.icon, 16) + '<span>' + item.label + '</span>';
    drawerNav.appendChild(btn);
  });
}

function closeDrawer() { document.getElementById('drawer-overlay').classList.remove('open'); }

function goTo(page){
  if(page === 'logout'){
    confirmAction('Are you sure you want to log out?', doLogout);
    return;
  }
  currentPage = page;
  const meta = pageMeta[page] || {title:page,sub:''};
  document.getElementById('page-title').textContent = meta.title;
  document.getElementById('page-sub').textContent = meta.sub;
  document.getElementById('topbar-back').classList.toggle('visible', page !== 'dashboard');
  buildNav();
  render();
  closeDrawer();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Normalize and validate a URL typed into the Project URL field */
function normalizeUrl(v){
  v = (v||'').trim();
  if(!v) return {ok:false, empty:true};
  if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try{
    const u = new URL(v);
    if(!u.hostname.includes('.')) return {ok:false};
    return {ok:true, value:u.href};
  }catch(e){ return {ok:false}; }
}
function wireProjectUrlApply(){
  const btn = document.getElementById('url-apply-btn');
  if(!btn) return;
  btn.addEventListener('click', function(){
    const input = document.getElementById('project-url-input');
    const msg = document.getElementById('url-apply-msg');
    const res = normalizeUrl(input.value);
    if(res.ok){
      input.value = res.value;
      msg.textContent = 'URL applied';
      msg.style.color = '#4ade80';
    } else if(res.empty){
      msg.textContent = 'Enter a URL first';
      msg.style.color = '#f87171';
    } else {
      msg.textContent = 'Please enter a valid URL';
      msg.style.color = '#f87171';
    }
  });
}
function deleteIcon(){ return '<svg class="icon" style="width:14px;height:14px;color:#f87171" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'; }

  const rawId = actionEl.dataset.id;
  const id = rawId === undefined ? null : (isNaN(Number(rawId)) ? rawId : Number(rawId));

  switch(action){
    case 'add-project':
      openModal('Add Project', projectForm(), function(d){
        const res = normalizeUrl(d.url);
        state.projects.push({id:nextId(state.projects), name:d.name, category:d.category, status:d.status, url:res.ok?res.value:'', grad:gradCycle[state.projects.length % gradCycle.length]});

      }, 'Go Back');

      openModal('Edit Project', projectForm(p), function(d){
        const res = normalizeUrl(d.url);
        Object.assign(p, {name:d.name, category:d.category, status:d.status, url:res.ok?res.value:''});
        save(); render(); showToast('Project updated');
      }, 'Go Back');
      wireProjectUrlApply();
      break;
    }
    case 'delete-project':
      confirmAction('Delete this project? This cannot be undone.', function(){
        state.projects = state.projects.filter(x=>x.id!==id);

    case 'add-category':
      openModal('Add Category', categoryForm(), function(d){
        state.categories.push({id:nextId(state.categories), name:d.name});
        save(); render(); showToast('Category added');
      });
      break;
    case 'edit-category': {
      const c = state.categories.find(x=>x.id===id);
      openModal('Edit Category', categoryForm(c), function(d){
        c.name = d.name; save(); render(); showToast('Category updated');
      });
      break;
    }
    case 'delete-category':
      confirmAction('Delete this category?', function(){
        state.categories = state.categories.filter(x=>x.id!==id);
        save(); render(); showToast('Category deleted');
      });
      break;

    case 'add-enquiry':
      openModal('Add Enquiry', enquiryForm(), function(d){
        state.enquiries.push({id:nextId(state.enquiries), name:d.name, phone:d.phone||'', location:d.location||'', type:d.type, time:'Just now', status:'New'});
        state.notifications.unshift({id:nextId(state.notifications), text:`New enquiry from ${d.name} (${d.type})`, time:'Just now', read:false});
        save(); render(); showToast('Enquiry added');
      }, 'Go Back');
      break;
    case 'handle-enquiry': {
      if (typeof id === 'string' && window.markLeadHandled) {
        window.markLeadHandled(id).then(()=>showToast('Enquiry marked handled'));
      } else {
        const en = state.enquiries.find(x=>x.id===id);
        if (en) en.status = 'Handled';
        save(); render(); showToast('Enquiry marked handled');
      }
      break;
    }
    case 'delete-enquiry':
      confirmAction('Delete this enquiry?', function(){
        if (typeof id === 'string' && window.deleteLead) {
          window.deleteLead(id).then(()=>showToast('Enquiry deleted'));
        } else {
          state.enquiries = state.enquiries.filter(x=>x.id!==id);
          save(); render(); showToast('Enquiry deleted');
        }
      });
      break;

    case 'add-blog':
      openModal('Add Blog Post', blogForm(), function(d){
        state.blog.push({id:nextId(state.blog), title:d.title, status:d.status, date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})});

    case 'edit-blog': {
      const b = state.blog.find(x=>x.id===id);
      openModal('Edit Blog Post', blogForm(b), function(d){
        b.title = d.title; b.status = d.status; save(); render(); showToast('Blog post updated');

    case 'edit-testimonial': {

        Object.assign(t, {name:d.name, role:d.role, text:d.text, rating:Number(d.rating)});

      confirmAction('Delete this backup?', function(){
        state.backups = state.backups.filter(x=>x.id!==id);
        save(); render(); showToast('Backup deleted');
      });
      break;
  }
});

  const box = document.getElementById('search-results');
  if(!q){ box.classList.remove('open'); box.innerHTML=''; return; }
  const results = [];
  state.projects.forEach(p => { if(p.name.toLowerCase().includes(q)) results.push({title:p.name, meta:'Project · '+p.category, page:'projects'}); });
  state.enquiries.forEach(en => { if(en.name.toLowerCase().includes(q) || en.type.toLowerCase().includes(q) || (en.location||'').toLowerCase().includes(q) || (en.phone||'').toLowerCase().includes(q)) results.push({title:en.name, meta:'Enquiry · '+en.type, page:'enquiries'}); });
  state.blog.forEach(b => { if(b.title.toLowerCase().includes(q)) results.push({title:b.title, meta:'Blog Post · '+b.status, page:'blog'}); });
  state.testimonials.forEach(t => { if(t.name.toLowerCase().includes(q)) results.push({title:t.name, meta:'Testimonial', page:'testimonials'}); });
  state.categories.forEach(c => { if(c.name.toLowerCase().includes(q)) results.push({title:c.name, meta:'Category', page:'categories'}); });
  state.users.forEach(u => { if(u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) results.push({title:u.name, meta:'User · '+u.role, page:'users'}); });

  box.innerHTML = results.length ? results.slice(0,8).map(r => `<div class="sr-item" data-page="${r.page}"><span class="sr-title">${esc(r.title)}</span><span class="sr-meta">${esc(r.meta)}</span></div>`).join('') : `<div class="sr-empty">No results for "${esc(this.value)}"</div>`;
  box.classList.add('open');
  box.querySelectorAll('.sr-item').forEach(el => {
    el.addEventListener('click', function(){
      goTo(this.dataset.page);
      box.classList.remove('open');
      searchInput.value = '';

});

      applyingRemoteState = false;
    } else {
      // First time ever — seed Firestore with whatever state we have locally.
      setDoc(stateDocRef, state).catch(() => {});
    }
  }, () => {
    if (typeof showToast === 'function') showToast('Could not sync with server — check your connection', 'error');
  });
}

function stopFirestoreSync(){
  if (stopStateSync) { stopStateSync(); stopStateSync = null; }
}

window.syncStateToFirestore = function () {
  if (applyingRemoteState || !auth.currentUser) return;
  setDoc(stateDocRef, state).catch(() => {
    if (typeof showToast === 'function') showToast('Could not save — check your connection', 'error');
  });
};

function timeAgo(date){
  const secs = Math.floor((Date.now() - date.getTime()) / 1000);
  if (secs < 60) return 'Just now';
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + (mins === 1 ? ' minute ago' : ' minutes ago');
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.floor(hrs / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

const leadsQuery = query(collection(db, 'leads'), orderBy('createdAt', 'desc'));
let stopLeadsSync = null;

function startLeadsSync(){
  if (stopLeadsSync) return;
  stopLeadsSync = onSnapshot(leadsQuery, (snap) => {
    window.liveLeads = snap.docs.map((d) => {
      const data = d.data();
      return {
        id: d.id,
        name: data.name || '',
        phone: data.phone || '',
        location: data.location || '',
        type: data.type || 'Free Consultation',
        status: data.status || 'New',
        time: data.createdAt && data.createdAt.toDate ? timeAgo(data.createdAt.toDate()) : 'Just now'
      };
    });
    if (typeof render === 'function') render();
    if (typeof updateBellDot === 'function') updateBellDot();
  }, () => {
    if (typeof showToast === 'function') showToast('Could not load enquiries — check your connection', 'error');
  });
}

function stopLeadsSyncFn(){
  if (stopLeadsSync) { stopLeadsSync(); stopLeadsSync = null; }
}

window.markLeadHandled = function (id) {
  return updateDoc(doc(db, 'leads', id), { status: 'Handled' }).catch(() => {
    if (typeof showToast === 'function') showToast('Could not update — check your connection', 'error');
  });
};
window.deleteLead = function (id) {
  return deleteDoc(doc(db, 'leads', id)).catch(() => {
    if (typeof showToast === 'function') showToast('Could not delete — check your connection', 'error');
  });
};

const loginScreen = document.getElementById('login-screen');
const appShell = document.getElementById('app-shell');
const loginForm = document.getElementById('login-form');
const loginError = document.getElementById('login-error');
const loginSubmit = document.getElementById('login-submit');
const loginEmailInput = document.getElementById('login-email');
const loginPasswordInput = document.getElementById('login-password');
const loginEyeToggle = document.getElementById('login-eye-toggle');
const eyeIconOpen = document.getElementById('eye-icon-open');
const eyeIconOff = document.getElementById('eye-icon-off');
loginEyeToggle.addEventListener('click', function () {
  const showing = loginPasswordInput.type === 'text';
  loginPasswordInput.type = showing ? 'password' : 'text';
  eyeIconOpen.style.display = showing ? '' : 'none';
  eyeIconOff.style.display = showing ? 'none' : '';
  loginEyeToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
});

/* ---- 3-attempt lockout ---- */
const MAX_ATTEMPTS = 3;
const LOCKOUT_MS = 60000;
let lockoutTimer = null;

function getLockState(){
  return {
    until: parseInt(localStorage.getItem('vexoraxLoginLockUntil') || '0', 10),
    attempts: parseInt(localStorage.getItem('vexoraxLoginAttempts') || '0', 10)
  };
}
function setAttempts(n){ localStorage.setItem('vexoraxLoginAttempts', String(n)); }
function setLockUntil(ts){ localStorage.setItem('vexoraxLoginLockUntil', String(ts)); }
function clearLockState(){ localStorage.removeItem('vexoraxLoginAttempts'); localStorage.removeItem('vexoraxLoginLockUntil'); }

function applyLockUI(){
  const { until } = getLockState();
  const now = Date.now();
  if (until > now) {
    const remaining = Math.ceil((until - now) / 1000);
    loginSubmit.disabled = true;
    loginEmailInput.disabled = true;
    loginPasswordInput.disabled = true;
    loginSubmit.textContent = 'Try again in ' + remaining + 's';
    loginError.textContent = 'Too many failed attempts. Please wait.';
    if (lockoutTimer) clearTimeout(lockoutTimer);
    lockoutTimer = setTimeout(applyLockUI, 1000);
    return true;
  }
  if (lockoutTimer) { clearTimeout(lockoutTimer); lockoutTimer = null; }
  loginEmailInput.disabled = false;
  loginPasswordInput.disabled = false;
  loginSubmit.disabled = false;
  loginSubmit.textContent = 'Sign In';
  if (getLockState().attempts >= MAX_ATTEMPTS) clearLockState();
  return false;
}
applyLockUI();

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginScreen.style.display = 'none';
    appShell.style.display = '';
    startFirestoreSync();
    startLeadsSync();
  } else {
    loginScreen.style.display = 'flex';
    appShell.style.display = 'none';
    applyLockUI();
    stopFirestoreSync();
    stopLeadsSyncFn();
  }
});

loginForm.addEventListener('submit', function (e) {
  e.preventDefault();
  if (applyLockUI()) return;
  loginError.textContent = '';
  loginSubmit.disabled = true;
  loginSubmit.textContent = 'Signing in...';
  const email = loginEmailInput.value.trim();
  const password = loginPasswordInput.value;
  signInWithEmailAndPassword(auth, email, password)
    .then(function () {
      clearLockState();
    })
    .catch(function (err) {
      let msg = 'Something went wrong. Try again.';
      const isCredentialFailure = ['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-email'].includes(err.code);
      if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
        msg = 'Incorrect email or password.';
      } else if (err.code === 'auth/invalid-email') {
        msg = 'Enter a valid email address.';
      } else if (err.code === 'auth/too-many-requests') {
        msg = 'Too many attempts. Try again in a bit.';
      }
      if (isCredentialFailure) {
        const { attempts } = getLockState();
        const newAttempts = attempts + 1;
        setAttempts(newAttempts);
        if (newAttempts >= MAX_ATTEMPTS) {
          setLockUntil(Date.now() + LOCKOUT_MS);
          applyLockUI();
          return;
        }
      }
      loginError.textContent = msg;
    })
    .finally(function () {
      if (!applyLockUI()) {
        loginSubmit.disabled = false;
        loginSubmit.textContent = 'Sign In';
      }
    });
});

window.doLogout = function () {
  signOut(auth);
};
